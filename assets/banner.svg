@keyframes scan{0%{transform:translateY(-10px)}100%{transform:translateY(270px)}}
.fade{animation:fade 1.6s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.d1{animation-delay:.3s}.d2{animation-delay:.9s}.d3{animation-delay:1.5s}
</style>
